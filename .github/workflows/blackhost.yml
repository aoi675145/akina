name: BlackHost 续期

on:
  workflow_dispatch:  # 只走外部触发，不配 cron

permissions:
  actions: write
  contents: write

jobs:
  auto_renew_blackhost:
    runs-on: ubuntu-22.04

    timeout-minutes: 25
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/blackhost/blackhost.py
            scripts/blackhost/apikey.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 📦 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # 只加超时/重试参数，绝不动 runner 自带的 mirror+file 源。
          # 实测（2026-11-11 run 43038192535）：runner 上 https://archive.ubuntu.com
          # 「Could not resolve」，apt 白等 69s 才报 W:。而镜像自带的 mirrorlist 会在
          # azure / archive / security 之间 failover，删掉它或把源改成直连 archive 都会让 apt 哑掉。
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          echo "=== apt 源（保持镜像自带，不覆盖）"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "=== DNS 探测（失败只影响 apt，不阻断）"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            printf '%s -> ' "$h"
            getent hosts "$h" | head -1 || echo "解析失败"
          done

      - name: 📦 安装系统与 Python 依赖
        timeout-minutes: 10
        run: |
          # google-chrome / xvfb / jq 镜像自带；xdotool 兜底点击 + 中文字体
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh \
              --need "Xvfb jq google-chrome" \
              --pkgs "xvfb jq"
          fi
          # apt 源不可达时的兜底：从本仓库 release 的 deb 资产解包（不碰 apt/DNS）
          if ! command -v xdotool >/dev/null 2>&1; then
            curl -fsSL --max-time 30 -o /tmp/ensure-deb.sh \
              https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-deb.sh \
              && bash /tmp/ensure-deb.sh --need "xdotool" --pkgs "libxdo3 xdotool" \
              || echo "::warning::ensure-deb.sh 兜底失败"
          fi
          command -v xdotool >/dev/null 2>&1 \
            || { echo "::error::xdotool 仍未装上（apt 与 release deb 都失败）"; exit 1; }
          # 中文字体不走 apt：直接从本仓库 release 取 ttc（github.com 可达，绕开 apt 源/DNS）
          if ! fc-list 2>/dev/null | grep -qi wenquanyi; then
            sudo mkdir -p /usr/share/fonts/truetype/wqy
            if sudo curl -fL --retry 3 --retry-delay 2 --max-time 180 \
                 -o /usr/share/fonts/truetype/wqy/wqy-microhei.ttc \
                 https://github.com/aoi675145/akina/releases/download/fonts/wqy-microhei.ttc; then
              sudo fc-cache -f >/dev/null 2>&1 || true
            else
              echo "::warning::wqy-microhei.ttc 下载失败（github.com 不可达）"
            fi
          fi
          fc-list 2>/dev/null | grep -qi wenquanyi \
            || { echo "::error::中文字体仍未装上：检查 releases/download/fonts 资产是否还在"; exit 1; }

          pip install -q seleniumbase "requests[socks]" pyautogui --retries 5 --timeout 60

      - name: 🌐 设置代理 (sing-box)
        env:
          BLACKHOST_PROXY: ${{ secrets.BLACKHOST_PROXY }}
        run: |
          # 代理必填：面板续期要过 Turnstile，已禁用直连模式
          if [ -z "$BLACKHOST_PROXY" ]; then
            echo "::error::BLACKHOST_PROXY 未配置（必填，已禁用直连）"
            exit 1
          fi
          NODE_LINK="$BLACKHOST_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 执行续期
        id: run_script
        env:
          PYTHONIOENCODING: utf-8
          BLACKHOST: ${{ secrets.BLACKHOST }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          cd private-repo/scripts/blackhost
          xvfb-run -a --server-args="-screen 0 1280x800x24" python -u blackhost.py

      - name: 🧹 清理代理进程
        if: always()
        run: |
          pkill -f sing-box || true

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: ❌ 失败通知（前置步骤）
        if: failure() && steps.run_script.conclusion != 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "[SKIP] 未配置 TG_BOT_TOKEN / TG_CHAT_ID"
            exit 0
          fi
          MSG="❌ ${GITHUB_WORKFLOW} 失败（脚本未运行）%0A任务: ${GITHUB_JOB}%0A仓库: ${GITHUB_REPOSITORY}%0A运行页: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${MSG}" || true
