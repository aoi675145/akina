name: Host2Play Auto Renew

on:
  schedule:
    - cron: '0 0,11,22 * * *'
    - cron: '30 5,16 * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry attempt number (0=initial, 1=first retry, 2=second retry)'
        required: false
        default: '0'

permissions:
  actions: write
  contents: read

jobs:
  run-renew:
    runs-on: ubuntu-latest

    timeout-minutes: 25
    steps:
      - name: 📥 拉取私有仓库代码
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # 只加超时/重试参数，绝不动 runner 自带的 mirror+file 源。
          # 实测（2026-11-11 run 43038192535）：runner 上 https://archive.ubuntu.com
          # 「Could not resolve」，apt 白等 69s 才报 W:。而镜像自带的 mirrorlist 会在
          # azure / archive / security 之间 failover，删掉它或把源改成直连 archive 都会让 apt 哑掉。
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          echo "=== apt 源（保持镜像自带，不覆盖）"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "=== DNS 探测（失败只影响 apt，不阻断）"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            printf '%s -> ' "$h"
            timeout 3 getent hosts "$h" 2>/dev/null | head -1 || echo "解析失败"
          done

      - name: 📦 安装系统依赖
        timeout-minutes: 10
        run: |
          # 系统包按需安装：ubuntu-24.04 镜像自带 xvfb/xauth/unzip/curl/wget/jq/Chrome，
          # 真缺才动 apt，源不可达快速放弃（逻辑见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "Xvfb unzip curl" --pkgs "xvfb unzip curl"
          fi
          # Chrome：镜像自带（google-chrome 156.x），缺了才下 deb
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::warning::未找到 google-chrome，下载 deb 安装"
            curl -fL --retry 3 --retry-delay 2 --retry-all-errors --max-time 240 \
              -o /tmp/chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y || true
          else
            echo "[INFO] 镜像自带 Chrome: $(google-chrome --version 2>/dev/null || echo unknown)"
          fi

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 60
          python -m pip install SeleniumBase xvfbwrapper requests SpeechRecognition pydub --retries 5 --timeout 60
          python - <<'PY'
          import seleniumbase
          import speech_recognition
          import pydub
          print('[INFO] Python 依赖校验通过')
          PY

      - name: 📦 预安装 SeleniumBase UC 驱动
        run: |
          seleniumbase install uc_driver > /tmp/uc_driver_install.log 2>&1 || {
            cat /tmp/uc_driver_install.log
            exit 1
          }
          echo "[INFO] SeleniumBase UC 驱动已准备"

      - name: 🌐 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: ⚙️ 修复 DNS
        run: |
          echo "[INFO] 停用 systemd-resolved，设置公共 DNS..."
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true

          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf

          sleep 2

          echo "[INFO] DNS 测试:"
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"

          echo ""
          echo "[INFO] 当前出口 IP: ***.***.***.***"
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'warp=|loc=' || true

      - name: 🚀 执行续订脚本
        id: renew_run
        continue-on-error: true
        env:
          H2PLAY_RENEW_URLS: ${{ secrets.H2PLAY_RENEW_URLS }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WORKFLOW_RETRY: ${{ github.event.inputs.retry || '0' }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd scripts/host2play
          stdbuf -oL python -u main.py 2>&1 && rc=0 || rc=$?
          echo "exit_code=$rc" >> $GITHUB_OUTPUT

      - name: ⚙️ 续订失败后重新触发工作流
        if: steps.renew_run.outputs.exit_code != '0' && github.event.inputs.retry != '2'
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          current=${{ github.event.inputs.retry || '0' }}
          next=$(( current + 1 ))
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f retry=$next
          exit 1

      - name: ⚙️ 重试 2 次后仍失败则停止
        if: steps.renew_run.outputs.exit_code != '0' && github.event.inputs.retry == '2'
        run: exit 1

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
