name: Magma Restart
on:
  workflow_dispatch:

jobs:
  Restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/magama/main.py
            scripts/setup_proxy.sh.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装底层依赖与浏览器
        run: |
          # 【核心】安装 xdotool(用于物理点击) 和 xvfb(虚拟屏幕)
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool wget unzip curl

          # 安装 SeleniumBase 并初始化 Chrome（requests[socks] 用于走 socks5 代理推送 TG）
          python -m pip install --upgrade pip
          pip install seleniumbase 'requests[socks]'
          seleniumbase install chromedriver

      - name: 🙈 隐藏敏感信息
        env:
          MAGMANODE: ${{ secrets.MAGMANODE }}
          MAGMA_PROXY: ${{ secrets.MAGMA_PROXY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -n "$MAGMANODE" ]; then echo "::add-mask::$MAGMANODE"; fi
          if [ -n "$MAGMA_PROXY" ]; then echo "::add-mask::$MAGMA_PROXY"; fi
          if [ -n "$BOT_TOKEN" ]; then echo "::add-mask::$BOT_TOKEN"; fi
          if [ -n "$TG_CHAT_ID" ]; then echo "::add-mask::$TG_CHAT_ID"; fi
          if [ -n "$REPO_TOKEN" ]; then echo "::add-mask::$REPO_TOKEN"; fi

          if [ -n "$MAGMANODE" ]; then
            ACCOUNT_PART=${MAGMANODE%%-----*}
            PASSWORD_PART=${MAGMANODE#*-----}
            echo "::add-mask::$ACCOUNT_PART"
            echo "::add-mask::$PASSWORD_PART"
          fi

      - name: 🛡️ 设置代理 (sing-box)
        env:
          MAGMA_PROXY: ${{ secrets.MAGMA_PROXY }}
        run: |
          if [ -z "$MAGMA_PROXY" ]; then
            echo "❌ 未配置 MAGMA_PROXY，直连模式已禁用"
            exit 1
          fi
          NODE_LINK="$MAGMA_PROXY" bash private-repo/scripts/setup_proxy.sh.sh

      - name: 🚀 运行 Magma Python 脚本
        env:
          PYTHONIOENCODING: utf-8
          MAGMANODE: ${{ secrets.MAGMANODE }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: private-repo/scripts/magama
        run: |
          set -o pipefail
          # 使用 xvfb-run 分配虚拟屏幕，让 xdotool 能够正常点击
          xvfb-run -a python main.py 2>&1 | tee magma.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
