name: Magma Restart
on:
  workflow_dispatch:

jobs:
  Restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/magama/main.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # 保留 runner 自带的 azure 镜像做首选（走 http，不碰 apt https 方法里
          # 会卡死的 TLS select 路径），archive.ubuntu.com 做备用，apt 自动 failover。
          # apt 超时是"单次 read"超时，慢速源会一直滴漏不触发，所以统一加 timeout 包裹。
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          # 与 runner-images 官方一致的超时/重试配置
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装底层依赖与浏览器
        timeout-minutes: 10
        run: |
          # 【核心】安装 xdotool(用于物理点击) 和 xvfb(虚拟屏幕)
          timeout 120 sudo apt-get update -qq || timeout 240 sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool wget unzip curl scrot python3-xlib -o Acquire::Retries=3

          # 安装 SeleniumBase 并初始化 Chrome（requests[socks] 用于走 socks5 代理推送 TG）
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install seleniumbase 'requests[socks]' pyautogui --retries 5 --timeout 60
          seleniumbase install chromedriver


      - name: 🛡️ 设置代理 (sing-box)
        env:
          MAGMA_PROXY: ${{ secrets.MAGMA_PROXY }}
        run: |
          if [ -z "$MAGMA_PROXY" ]; then
            echo "❌ 未配置 MAGMA_PROXY，直连模式已禁用"
            exit 1
          fi
          NODE_LINK="$MAGMA_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行 Magma Python 脚本
        env:
          PYTHONIOENCODING: utf-8
          MAGMANODE: ${{ secrets.MAGMANODE }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: private-repo/scripts/magama
        run: |
          set -o pipefail
          # 使用 xvfb-run 分配虚拟屏幕，让 xdotool 能够正常点击
          xvfb-run -a python main.py 2>&1 | tee magma.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
