name: Magma Restart
on:
  workflow_dispatch:

jobs:
  Restart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/magama/main.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # 只加超时/重试参数，绝不动 runner 自带的 mirror+file 源。
          # 实测（2026-11-11 run 43038192535）：runner 上 https://archive.ubuntu.com
          # 「Could not resolve」，apt 白等 69s 才报 W:。而镜像自带的 mirrorlist 会在
          # azure / archive / security 之间 failover，删掉它或把源改成直连 archive 都会让 apt 哑掉。
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          echo "=== apt 源（保持镜像自带，不覆盖）"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "=== DNS 探测（失败只影响 apt，不阻断）"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            printf '%s -> ' "$h"
            getent hosts "$h" | head -1 || echo "解析失败"
          done

      - name: 📦 安装底层依赖（apt）
        timeout-minutes: 8
        run: |
          # 只装真正需要的：xdotool（物理点击）。xvfb 通常已在 runner 镜像里。
          # 不装 scrot / python3-xlib：scrot 会连带拽进 librsvg→ghostscript 一整串
          # （25MB/26 包，慢源上必超时），而脚本截图走 seleniumbase 自带能力；
          # python3-xlib 是 apt 系统包，setup-python 的解释器 import 不到，
          # pyautogui 真正要的是 pip 的 python-xlib（见下一步）。
          # 系统包按需安装：ubuntu-24.04 镜像自带 xvfb/xauth/unzip/curl/wget/jq/Chrome，
          # 真缺才动 apt，源不可达快速放弃（逻辑见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "Xvfb xauth" --pkgs "xvfb xauth"
          fi
          # apt 源不可达时的兜底：从本仓库 release 的 deb 资产解包（不碰 apt/DNS）
          if ! command -v xdotool >/dev/null 2>&1; then
            curl -fsSL --max-time 30 -o /tmp/ensure-deb.sh \
              https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-deb.sh \
              && bash /tmp/ensure-deb.sh --need "xdotool" --pkgs "libxdo3 xdotool" \
              || echo "::warning::ensure-deb.sh 兜底失败"
          fi
          command -v xdotool >/dev/null 2>&1 \
            || { echo "::error::xdotool 仍未装上（apt 与 release deb 都失败）"; exit 1; }

      - name: 📦 安装 Python 依赖与浏览器
        timeout-minutes: 8
        run: |
          # requests[socks] 用于走 socks5 代理推送 TG；python-xlib 是 pyautogui 在 X11 下的真实依赖
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install seleniumbase 'requests[socks]' pyautogui python-xlib --retries 5 --timeout 60
          seleniumbase install chromedriver


      - name: 🛡️ 设置代理 (sing-box)
        env:
          MAGMA_PROXY: ${{ secrets.MAGMA_PROXY }}
        run: |
          if [ -z "$MAGMA_PROXY" ]; then
            echo "❌ 未配置 MAGMA_PROXY，直连模式已禁用"
            exit 1
          fi
          NODE_LINK="$MAGMA_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行 Magma Python 脚本
        env:
          PYTHONIOENCODING: utf-8
          MAGMANODE: ${{ secrets.MAGMANODE }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: private-repo/scripts/magama
        run: |
          set -o pipefail
          # 使用 xvfb-run 分配虚拟屏幕，让 xdotool 能够正常点击
          xvfb-run -a python main.py 2>&1 | tee magma.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
