name: Magma Restart
on:
  workflow_dispatch:

jobs:
  Restart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/magama/main.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # 幂等修源：先清空所有源文件与旧索引，再写一份直连 https 源。
          # 坑1：runner 镜像的 ubuntu.sources 指向 mirror+file:/etc/apt/apt-mirrors.txt，
          #      只删 mirrorlist 不换源 → 每个 repo 秒报 "no longer has a Release file"，
          #      45s/60s 的 timeout 包裹全成摆设（日志里连续三条 warning 各只花 1 秒）。
          # 坑2：不清 /var/lib/apt/lists，apt 仍按上次记录的 mirror+file: 记账，
          #      报错里出现的是旧源名，最容易误判成「新源没生效」。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          echo "=== 生效的源"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources || true
          echo "=== 生效的 acquire 配置"
          apt-config dump Acquire::Retries Acquire::http::Timeout || true
          timeout 90 sudo apt-get update -qq -o Acquire::ForceIPv4=true \
            || echo "::warning::apt-get update 未完全成功，交后续 ensure-apt.sh 兜底"

      - name: 📦 安装底层依赖（apt）
        timeout-minutes: 8
        run: |
          # 只装真正需要的：xdotool（物理点击）。xvfb 通常已在 runner 镜像里。
          # 不装 scrot / python3-xlib：scrot 会连带拽进 librsvg→ghostscript 一整串
          # （25MB/26 包，慢源上必超时），而脚本截图走 seleniumbase 自带能力；
          # python3-xlib 是 apt 系统包，setup-python 的解释器 import 不到，
          # pyautogui 真正要的是 pip 的 python-xlib（见下一步）。
          # 系统包按需安装：ubuntu-24.04 镜像自带 xvfb/xauth/unzip/curl/wget/jq/Chrome，
          # 真缺才动 apt，源不可达快速放弃（逻辑见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "Xvfb xdotool xauth" --pkgs "xvfb xdotool xauth"
          fi

      - name: 📦 安装 Python 依赖与浏览器
        timeout-minutes: 8
        run: |
          # requests[socks] 用于走 socks5 代理推送 TG；python-xlib 是 pyautogui 在 X11 下的真实依赖
          python -m pip install --upgrade pip --retries 5 --timeout 60
          pip install seleniumbase 'requests[socks]' pyautogui python-xlib --retries 5 --timeout 60
          seleniumbase install chromedriver


      - name: 🛡️ 设置代理 (sing-box)
        env:
          MAGMA_PROXY: ${{ secrets.MAGMA_PROXY }}
        run: |
          if [ -z "$MAGMA_PROXY" ]; then
            echo "❌ 未配置 MAGMA_PROXY，直连模式已禁用"
            exit 1
          fi
          NODE_LINK="$MAGMA_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行 Magma Python 脚本
        env:
          PYTHONIOENCODING: utf-8
          MAGMANODE: ${{ secrets.MAGMANODE }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: private-repo/scripts/magama
        run: |
          set -o pipefail
          # 使用 xvfb-run 分配虚拟屏幕，让 xdotool 能够正常点击
          xvfb-run -a python main.py 2>&1 | tee magma.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
