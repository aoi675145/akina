name: OPENCHUNK 续期

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openchunk]

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/openchunk/openchunk.py
            scripts/openchunk/cron-job.txt
            cron-job.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # 只加超时/重试参数，绝不动 runner 自带的 mirror+file 源。
          # 实测（2026-11-11 run 43038192535）：runner 上 https://archive.ubuntu.com
          # 「Could not resolve」，apt 白等 69s 才报 W:。而镜像自带的 mirrorlist 会在
          # azure / archive / security 之间 failover，删掉它或把源改成直连 archive 都会让 apt 哑掉。
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          echo "=== apt 源（保持镜像自带，不覆盖）"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo "=== DNS 探测（失败只影响 apt，不阻断）"
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            printf '%s -> ' "$h"
            getent hosts "$h" | head -1 || echo "解析失败"
          done

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          set -o pipefail
          # 系统包按需安装：ubuntu-24.04 镜像自带 xvfb/xauth/unzip/curl/wget/jq/Chrome，
          # 真缺才动 apt，源不可达快速放弃（逻辑见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "Xvfb fc-cache" \
              --pkgs "xvfb fontconfig"
          fi
          # 中文字体不走 apt：直接从本仓库 release 取 ttc（github.com 可达，绕开 apt 源/DNS）
          if ! fc-list 2>/dev/null | grep -qi wenquanyi; then
            sudo mkdir -p /usr/share/fonts/truetype/wqy
            if sudo curl -fL --retry 3 --retry-delay 2 --max-time 180 \
                 -o /usr/share/fonts/truetype/wqy/wqy-microhei.ttc \
                 https://github.com/aoi675145/akina/releases/download/fonts/wqy-microhei.ttc; then
              sudo fc-cache -f >/dev/null 2>&1 || true
            else
              echo "::warning::wqy-microhei.ttc 下载失败（github.com 不可达）"
            fi
          fi
          fc-list 2>/dev/null | grep -qi wenquanyi \
            || { echo "::error::中文字体仍未装上：检查 releases/download/fonts 资产是否还在"; exit 1; }

          pip install --retries 5 --timeout 60 -q 'requests[socks]' seleniumbase
          seleniumbase install chromedriver

      - name: 🌐 设置代理 (sing-box)
        env:
          OPENCHUNK_PROXY: ${{ secrets.OPENCHUNK_PROXY }}
        run: |
          if [ -z "$OPENCHUNK_PROXY" ]; then
            echo "::error::OPENCHUNK_PROXY 未配置（必填，本脚本必须走代理）"
            exit 1
          fi
          NODE_LINK="$OPENCHUNK_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          OPENCHUNK: ${{ secrets.OPENCHUNK }}
          OPENCHUNK_SERVER: ${{ secrets.OPENCHUNK_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python -u private-repo/scripts/openchunk/openchunk.py 2>&1 | tee renew.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
