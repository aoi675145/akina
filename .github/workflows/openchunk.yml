name: OPENCHUNK 续期

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openchunk]

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/openchunk/openchunk.py
            scripts/openchunk/cron-job.txt
            cron-job.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fontconfig fonts-wqy-microhei
          pip install -q 'requests[socks]' seleniumbase
          seleniumbase install chromedriver

      - name: 🌐 设置代理 (sing-box)
        env:
          OPENCHUNK_PROXY: ${{ secrets.OPENCHUNK_PROXY }}
        run: |
          if [ -z "$OPENCHUNK_PROXY" ]; then
            echo "::error::OPENCHUNK_PROXY 未配置（必填，本脚本必须走代理）"
            exit 1
          fi
          NODE_LINK="$OPENCHUNK_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          OPENCHUNK: ${{ secrets.OPENCHUNK }}
          OPENCHUNK_SERVER: ${{ secrets.OPENCHUNK_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python -u private-repo/scripts/openchunk/openchunk.py 2>&1 | tee renew.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
