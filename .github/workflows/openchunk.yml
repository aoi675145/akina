name: OPENCHUNK 续期

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openchunk] # 外部触发：POST /repos/{owner}/{repo}/dispatches, event_type=openchunk

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/openchunk/openchunk.py
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: pip install -q 'requests[socks]'

      - name: 🌐 设置代理 (sing-box)
        env:
          OPENCHUNK_PROXY: ${{ secrets.OPENCHUNK_PROXY }}
        run: |
          NODE_LINK="$OPENCHUNK_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          OPENCHUNK: ${{ secrets.OPENCHUNK }}
          OPENCHUNK_SERVER: ${{ secrets.OPENCHUNK_SERVER }} # 留空自动获取全部服务器
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python -u private-repo/scripts/openchunk/openchunk.py 2>&1 | tee renew.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
