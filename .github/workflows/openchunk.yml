name: OPENCHUNK 续期

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openchunk]

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          token: ${{ secrets.REPO_TOKEN }}
          path: private-repo
          sparse-checkout: |
            scripts/openchunk/openchunk.py
            scripts/openchunk/cron-job.txt
            cron-job.txt
            scripts/setup_proxy.sh
          sparse-checkout-cone-mode: false

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 修复 apt 源
        run: |
          # jammy 用 http 镜像（azure 首选），绕开 apt https 方法会卡死的 TLS select 路径；
          # apt 的超时是"单次 read"超时，慢速源会滴漏不触发，统一 timeout+retries 包裹。
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: jammy jammy-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: jammy jammy-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: jammy-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          # ubuntu-22.04 还在用旧版 sources.list（mirror+file:/etc/apt/apt-mirrors.txt 条目），
          # 只删 mirrors.txt 不删这一行 apt 会报 "no longer has a Release file"
          sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
          deb http://azure.archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb http://azure.archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb fontconfig fonts-wqy-microhei -o Acquire::http::Timeout=20
          pip install --retries 5 --timeout 60 -q 'requests[socks]' seleniumbase
          seleniumbase install chromedriver

      - name: 🌐 设置代理 (sing-box)
        env:
          OPENCHUNK_PROXY: ${{ secrets.OPENCHUNK_PROXY }}
        run: |
          if [ -z "$OPENCHUNK_PROXY" ]; then
            echo "::error::OPENCHUNK_PROXY 未配置（必填，本脚本必须走代理）"
            exit 1
          fi
          NODE_LINK="$OPENCHUNK_PROXY" bash private-repo/scripts/setup_proxy.sh

      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          OPENCHUNK: ${{ secrets.OPENCHUNK }}
          OPENCHUNK_SERVER: ${{ secrets.OPENCHUNK_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          python -u private-repo/scripts/openchunk/openchunk.py 2>&1 | tee renew.log

      - name: 🧹 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
