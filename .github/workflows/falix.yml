name: Falix 重启

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱（留空全部，多个用逗号）'
        required: false
#  schedule:
#    - cron: '0 */6 * * *'  # 每 6 小时执行一次

jobs:
  restart:
    name: 执行脚本
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'  
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # 幂等修源：先清空所有源文件与旧索引，再写一份直连 https 源。
          # 坑1：runner 镜像的 ubuntu.sources 指向 mirror+file:/etc/apt/apt-mirrors.txt，
          #      只删 mirrorlist 不换源 → 每个 repo 秒报 "no longer has a Release file"，
          #      45s/60s 的 timeout 包裹全成摆设（日志里连续三条 warning 各只花 1 秒）。
          # 坑2：不清 /var/lib/apt/lists，apt 仍按上次记录的 mirror+file: 记账，
          #      报错里出现的是旧源名，最容易误判成「新源没生效」。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          echo "=== 生效的源"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources || true
          echo "=== 生效的 acquire 配置"
          apt-config dump Acquire::Retries Acquire::http::Timeout || true
          timeout 90 sudo apt-get update -qq -o Acquire::ForceIPv4=true \
            || echo "::warning::apt-get update 未完全成功，交后续 ensure-apt.sh 兜底"

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          # 系统包按需安装：ubuntu-24.04 镜像自带 xvfb/xauth/unzip/curl/wget/jq/Chrome，
          # 真缺才动 apt，源不可达快速放弃（逻辑见 .github/scripts/ensure-apt.sh）
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "xz fc-cache" \
              --need-cmd 'fc-list 2>/dev/null | grep -qi wenquanyi' \
              --pkgs "xz-utils fontconfig"
          fi
          # 中文字体不走 apt：直接解包官方 deb（绕过源/索引，apt 再烂也装得上）
          if ! fc-list 2>/dev/null | grep -qi wenquanyi; then
            if curl -fL --retry 3 --retry-delay 2 --max-time 120 -o /tmp/wqy.deb \
                 https://archive.ubuntu.com/ubuntu/pool/universe/f/fonts-wqy-microhei/fonts-wqy-microhei_0.2.0-beta-3.1_all.deb; then
              rm -rf /tmp/wqy && dpkg -x /tmp/wqy.deb /tmp/wqy
              sudo mkdir -p /usr/share/fonts/truetype/wqy
              sudo cp -r /tmp/wqy/usr/share/fonts/truetype/wqy/. /usr/share/fonts/truetype/wqy/
              sudo fc-cache -f >/dev/null 2>&1 || true
            else
              echo "::warning::wqy deb 下载失败（archive.ubuntu.com 不可达）"
            fi
          fi
          fc-list 2>/dev/null | grep -qi wenquanyi \
            || { echo "::error::中文字体仍未装上：检查 archive.ubuntu.com 可达性或 deb 版本号"; exit 1; }

          fc-cache -fv >/dev/null 2>&1 || true
          # ffmpeg 用静态二进制（音频验证码 pydub 转 wav 必需），apt 版会拽进 100+ 多媒体依赖
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fL --retry 3 --retry-delay 2 --retry-all-errors --max-time 180 \
              -o /tmp/ffmpeg.tar.xz \
              https://github.com/aoi675145/akina/releases/download/ffmpeg/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo ln -sf /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
            sudo ln -sf /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          fi
          ffmpeg -version | head -1
          pip install -q seleniumbase requests pyvirtualdisplay --retries 5 --timeout 60

      - name: 🌐 配置代理 (sing-box)
        env:
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # 广告相关域名走直连，避免开机奖励广告经过代理
          export DIRECT_DOMAINS="anyadx.live googleadservices.com googlesyndication.com doubleclick.net"
          NODE_LINK="$Falix_PROXY_NODE" bash scripts/setup_proxy.sh

      - name: 🚀 执行重启脚本
        id: falix_run
        env:
          FALIX: ${{ secrets.FALIX }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # sing-box 入站：SOCKS 127.0.0.1:1080 / HTTP 127.0.0.1:1081
          # 浏览器和 requests 统一走 HTTP 入站（与脚本内的 PROXY_SERVER 兼容）
          if [ -n "$Falix_PROXY_NODE" ]; then
            export PROXY_SERVER="http://127.0.0.1:1081"
            echo "[INFO] 使用代理: $PROXY_SERVER"
          else
            echo "[INFO] 直连模式"
          fi

          # 进入私库对应的目录并执行
          cd scripts/falix
          python main.py

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
