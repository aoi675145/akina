name: Falix 重启

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱（留空全部，多个用逗号）'
        required: false
#  schedule:
#    - cron: '0 */6 * * *'  # 每 6 小时执行一次

jobs:
  restart:
    name: 执行脚本
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'  
          token: ${{ secrets.REPO_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xz-utils fonts-noto-cjk fontconfig
          fc-cache -fv >/dev/null 2>&1 || true
          curl -L -o /tmp/ffmpeg.tar.xz https://github.com/aoi675145/akina/releases/download/ffmpeg/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          sudo ln -sf /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version
          pip install -q seleniumbase requests pyvirtualdisplay

      - name: 配置代理 (sing-box)
        env:
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # 复用 Overnode 的 sing-box 代理脚本（支持 vless/vmess/trojan/hysteria2/tuic/anytls/ss/socks）
          # 广告相关域名走直连，避免开机奖励广告经过代理
          export DIRECT_DOMAINS="anyadx.live googleadservices.com googlesyndication.com doubleclick.net"
          NODE_LINK="$Falix_PROXY_NODE" bash scripts/setup_proxy.sh.sh

      - name: 执行重启脚本
        id: falix_run
        env:
          FALIX: ${{ secrets.FALIX }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # sing-box 入站：SOCKS 127.0.0.1:1080 / HTTP 127.0.0.1:1081
          # 浏览器和 requests 统一走 HTTP 入站（与脚本内的 PROXY_SERVER 兼容）
          if [ -n "$Falix_PROXY_NODE" ]; then
            export PROXY_SERVER="http://127.0.0.1:1081"
            echo "[INFO] 使用代理: $PROXY_SERVER"
          else
            echo "[INFO] 直连模式"
          fi

          # 进入私库对应的目录并执行
          cd scripts/falix
          python main.py

      - name: 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
