name: Falix 重启

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定邮箱（留空全部，多个用逗号）'
        required: false
#  schedule:
#    - cron: '0 */6 * * *'  # 每 6 小时执行一次

jobs:
  restart:
    name: 执行脚本
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4
        with:
          repository: 'aoi675145/scripts'  
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 修复 apt 源
        run: |
          # 保留 runner 自带的 azure 镜像做首选（走 http，不碰 apt https 方法里
          # 会卡死的 TLS select 路径），archive.ubuntu.com 做备用，apt 自动 failover。
          # apt 超时是"单次 read"超时，慢速源会一直滴漏不触发，所以统一加 timeout 包裹。
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          # 与 runner-images 官方一致的超时/重试配置
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 📦 安装依赖
        timeout-minutes: 10
        run: |
          timeout 120 sudo apt-get update -qq || timeout 240 sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xz-utils fontconfig fonts-wqy-microhei -o Acquire::Retries=3
          fc-cache -fv >/dev/null 2>&1 || true
          curl -L -o /tmp/ffmpeg.tar.xz https://github.com/aoi675145/akina/releases/download/ffmpeg/ffmpeg-release-amd64-static.tar.xz
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          sudo ln -sf /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          ffmpeg -version
          pip install -q seleniumbase requests pyvirtualdisplay --retries 5 --timeout 60

      - name: 🌐 配置代理 (sing-box)
        env:
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # 广告相关域名走直连，避免开机奖励广告经过代理
          export DIRECT_DOMAINS="anyadx.live googleadservices.com googlesyndication.com doubleclick.net"
          NODE_LINK="$Falix_PROXY_NODE" bash scripts/setup_proxy.sh

      - name: 🚀 执行重启脚本
        id: falix_run
        env:
          FALIX: ${{ secrets.FALIX }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          Falix_PROXY_NODE: ${{ secrets.Falix_PROXY_NODE }}
        run: |
          # sing-box 入站：SOCKS 127.0.0.1:1080 / HTTP 127.0.0.1:1081
          # 浏览器和 requests 统一走 HTTP 入站（与脚本内的 PROXY_SERVER 兼容）
          if [ -n "$Falix_PROXY_NODE" ]; then
            export PROXY_SERVER="http://127.0.0.1:1081"
            echo "[INFO] 使用代理: $PROXY_SERVER"
          else
            echo "[INFO] 直连模式"
          fi

          # 进入私库对应的目录并执行
          cd scripts/falix
          python main.py

      - name: 🧹 清理运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
