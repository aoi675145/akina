name: Godlike 续期

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定ID（留空运行全部）'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  run-renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    # 整个 job 的兜底超时：任何一步卡死最多拖 20 分钟，避免空烧额度
    timeout-minutes: 20

    steps:
      - name: 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $REPO_TOKEN" \
            -L -o renew.py \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/godlike/renew.py"
          ls -la renew.py

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 修复 apt 源
        run: |
          # 保留 runner 自带的 azure 镜像做首选（走 http，不碰 apt https 方法里
          # 会卡死的 TLS select 路径），archive.ubuntu.com 做备用，apt 自动 failover。
          # apt 超时是"单次 read"超时，慢速源会一直滴漏不触发，所以统一加 timeout 包裹。
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          # 与 runner-images 官方一致的超时/重试配置
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 安装系统依赖
        run: |
          # 首次 update 只给 120s：慢源在 apt 里不会自己超时（单次 read 超时而已），
          # 与其让它滴漏 4 分钟，不如快速放弃换一次全新连接，通常第二把就正常。
          timeout 120 sudo apt-get update -qq || timeout 240 sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q DrissionPage DataRecorder DownloadKit xvfbwrapper requests SpeechRecognition pydub
          python - <<'PY'
          import DataRecorder
          import DrissionPage
          print('[INFO] Python 依赖校验通过')
          PY

      - name: 启用 WARP 网络
        # 官方 fscarmen/warp-on-actions 的 client 模式在 ubuntu-24.04 上会卡死：
        # cloudflare-warp 客户端注册/连接阶段无响应，整个 job 挂到 6 小时上限。
        # 这里改用 wg-quick 直连 WARP 隧道，不装 cloudflare-warp 客户端。
        # 注意：wg-quick up 只代表"隧道已创建"，握手可能失败；握手不通时全部
        # 流量（含 DNS）都会进黑洞，所以必须用 latest-handshake 验证，
        # 依次尝试 2408/4500/500 三个端口（2408 被 Azure 网络拦时走 IPsec 常用端口）。
        run: |
          sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends \
            net-tools iproute2 resolvconf dnsutils iptables wireguard-tools
          LAN=$(ip route get 192.168.193.10 | grep -oP 'src \K\S+')
          start_warp() {
            local port=$1
            sudo wg-quick down warp 2>/dev/null || true
            sudo tee /etc/wireguard/warp.conf > /dev/null <<EOF
          [Interface]
          PrivateKey = cKE7LmCF61IhqqABGhvJ44jWXp8fKymcMAEVAzbDF2k=
          Address = 172.16.0.2/32
          Address = fd01:5ca1:ab1e:823e:e094:eb1c:ff87:1fab/128
          PostUp = ip -4 rule add from $LAN lookup main
          PostDown = ip -4 rule delete from $LAN lookup main
          DNS = 1.1.1.1,8.8.8.8
          MTU = 1280

          [Peer]
          PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
          AllowedIPs = 0.0.0.0/0
          AllowedIPs = ::/0
          Endpoint = engage.cloudflareclient.com:$port
          EOF
            sudo wg-quick up warp 2>&1 | tail -2
            # 最多等 20 秒，握手成功（latest-handshake 非 0）才算可用
            for _ in $(seq 1 20); do
              hs=$(sudo wg show warp latest-handshake 2>/dev/null | awk '{print $2}')
              [ -n "$hs" ] && [ "$hs" != "0" ] && return 0
              sleep 1
            done
            echo "[WARN] 端口 $port 握手超时"
            return 1
          }
          if start_warp 2408 || start_warp 4500 || start_warp 500; then
            echo "[INFO] WARP 隧道握手成功"
          else
            # 建不起来就彻底拆掉隧道回退直连：半死隧道会让所有流量进黑洞，
            # 比没有 WARP 更糟（页面完全打不开、换 IP 也失败）
            echo "[WARN] WARP 三个端口均握手失败，回退直连继续"
            sudo wg-quick down warp 2>/dev/null || true
          fi

      - name: 修复 DNS
        run: |
          sleep 3
          mask_ip() { sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.**.**/g'; }
          echo "[INFO] WARP 状态: $(sudo wg show 2>/dev/null | head -1 || true)"
          IP=$(curl -s --max-time 10 https://api.ipify.org | mask_ip)
          echo "[INFO] 当前出口 IP: ${IP:-获取失败}"
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E 'ip=|warp=|loc=' | mask_ip || true

      - name: 执行续订
        env:
          GODLIKE_ID: ${{ secrets.GODLIKE_ID }}
          GODLIKE_ID_INPUT: ${{ github.event.inputs.accounts }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
