name: Godlike 续期

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定ID（留空运行全部）'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  run-renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    # 整个 job 的兜底超时：任何一步卡死最多拖 20 分钟，避免空烧额度
    timeout-minutes: 20

    steps:
      - name: 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $REPO_TOKEN" \
            -L -o renew.py \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/godlike/renew.py"
          ls -la renew.py

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 修复 apt 源
        run: |
          # 保留 runner 自带的 azure 镜像做首选（走 http，不碰 apt https 方法里
          # 会卡死的 TLS select 路径），archive.ubuntu.com 做备用，apt 自动 failover。
          # apt 超时是"单次 read"超时，慢速源会一直滴漏不触发，所以统一加 timeout 包裹。
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://azure.archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          # 与 runner-images 官方一致的超时/重试配置
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF

      - name: 安装系统依赖
        run: |
          # 首次 update 只给 120s：慢源在 apt 里不会自己超时（单次 read 超时而已），
          # 与其让它滴漏 4 分钟，不如快速放弃换一次全新连接，通常第二把就正常。
          timeout 120 sudo apt-get update -qq || timeout 240 sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q DrissionPage DataRecorder DownloadKit xvfbwrapper requests SpeechRecognition pydub
          python - <<'PY'
          import DataRecorder
          import DrissionPage
          print('[INFO] Python 依赖校验通过')
          PY

      - name: 启用 WARP 网络
        # 恢复为 fscarmen 官方 action 的 client 模式（cloudflare-warp + warp+doh）。
        # wg-quick 直连在这些 runner 上 UDP 2408/4500/500 全部握手失败，
        # 半死隧道会把所有流量带进黑洞；client 模式自带多端口探测/回退，实测能连上。
        # 加 5 分钟步骤超时 + 失败不阻断：万一安装/注册再卡住，回退直连继续跑。
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
        timeout-minutes: 5
        continue-on-error: true

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" \
            | sudo tee /etc/resolv.conf
          sleep 2
          mask_ip() { sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.**.**/g'; }
          echo "[INFO] WARP 状态: $(sudo warp-cli --accept-tos status 2>/dev/null || true)"
          echo "[INFO] 当前出口 IP: $(curl -s --max-time 10 https://api.ipify.org | mask_ip || true)"
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E 'ip=|warp=|loc=' | mask_ip || true

      - name: 执行续订
        env:
          GODLIKE_ID: ${{ secrets.GODLIKE_ID }}
          GODLIKE_ID_INPUT: ${{ github.event.inputs.accounts }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
