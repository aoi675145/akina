name: Godlike 续期

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '指定ID（留空运行全部）'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  run-renew:
    name: 执行续期脚本
    runs-on: ubuntu-latest
    # 整个 job 的兜底超时：任何一步卡死最多拖 20 分钟，避免空烧额度
    timeout-minutes: 25

    steps:
      - name: 📥 从私库拉取脚本
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $REPO_TOKEN" \
            -L -o renew.py \
            "https://raw.githubusercontent.com/aoi675145/scripts/main/scripts/godlike/renew.py"
          ls -la renew.py

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 修复 apt 源
        run: |
          # 幂等修源：先清空所有源文件与旧索引，再写一份直连 https 源。
          # 坑1：runner 镜像的 ubuntu.sources 指向 mirror+file:/etc/apt/apt-mirrors.txt，
          #      只删 mirrorlist 不换源 → 每个 repo 秒报 "no longer has a Release file"，
          #      45s/60s 的 timeout 包裹全成摆设（日志里连续三条 warning 各只花 1 秒）。
          # 坑2：不清 /var/lib/apt/lists，apt 仍按上次记录的 mirror+file: 记账，
          #      报错里出现的是旧源名，最容易误判成「新源没生效」。
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/99-timeouts > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::http::Pipeline-Depth "0";
          EOF
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          echo "=== 生效的源"
          grep -hE '^(Types|URIs|Suites):' /etc/apt/sources.list.d/*.sources || true
          echo "=== 生效的 acquire 配置"
          apt-config dump Acquire::Retries Acquire::http::Timeout || true
          timeout 90 sudo apt-get update -qq -o Acquire::ForceIPv4=true \
            || echo "::warning::apt-get update 未完全成功，交后续 ensure-apt.sh 兜底"

      - name: 📦 安装系统依赖
        run: |
          # 关键前提：ubuntu-24.04 镜像自带 xvfb / unzip / curl / wget / Google Chrome，
          # 依赖装不装由 ensure-apt.sh 按实际情况决定；apt 不通也不会把 job 拖死
          # （2026-11-10 02:30 那次就是 120s+240s 两把 apt 超时 → exit 124 → 后续全 skipped）。
          curl -fsSL --max-time 30 -o /tmp/ensure-apt.sh \
            https://raw.githubusercontent.com/aoi675145/akina/main/.github/scripts/ensure-apt.sh \
            || echo "::warning::ensure-apt.sh 拉取失败，依赖交给镜像自带"
          if [ -s /tmp/ensure-apt.sh ]; then
            bash /tmp/ensure-apt.sh --need "Xvfb unzip curl wget" --pkgs "xvfb unzip curl wget"
          fi

          # ffmpeg 用静态二进制（renew.py 音频验证码识别 pydub 转 wav 必需）；
          # apt 版会拉进 100+ 个多媒体依赖，慢源下必超时，做法同 falix.yml。
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -fL --retry 3 --retry-delay 2 --retry-all-errors --max-time 180 \
              -o /tmp/ffmpeg.tar.xz \
              https://github.com/aoi675145/akina/releases/download/ffmpeg/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo ln -sf /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
            sudo ln -sf /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe
          fi
          ffmpeg -version | head -1

          # Chrome 同理：镜像自带 156.x，缺了才装。
          if command -v google-chrome >/dev/null 2>&1; then
            echo "[INFO] 镜像自带 Chrome: $(google-chrome --version 2>/dev/null || echo unknown)"
          else
            echo "::warning::未找到 google-chrome，下载 deb 安装"
            curl -fL --retry 3 --retry-delay 2 --retry-all-errors --max-time 240 \
              -o /tmp/chrome.deb \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y || true
          fi

          # 依赖自检：缺什么直接点名，别让后面的浏览器步骤报天书
          for c in Xvfb ffmpeg google-chrome; do
            command -v "$c" >/dev/null 2>&1 || { echo "::error::依赖缺失: $c"; exit 1; }
          done
          echo "[INFO] 系统依赖自检通过"

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q DrissionPage DataRecorder DownloadKit xvfbwrapper requests SpeechRecognition pydub
          python - <<'PY'
          import DataRecorder
          import DrissionPage
          print('[INFO] Python 依赖校验通过')
          PY

      - name: 🌐 启用 WARP 网络
        # 恢复为 fscarmen 官方 action 的 client 模式（cloudflare-warp + warp+doh）。
        # wg-quick 直连在这些 runner 上 UDP 2408/4500/500 全部握手失败，
        # 半死隧道会把所有流量带进黑洞；client 模式自带多端口探测/回退，实测能连上。
        # 加 5 分钟步骤超时 + 失败不阻断：万一安装/注册再卡住，回退直连继续跑。
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client
        timeout-minutes: 5
        continue-on-error: true

      - name: ⚙️ 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" \
            | sudo tee /etc/resolv.conf
          sleep 2
          mask_ip() { sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.**.**/g'; }
          echo "[INFO] WARP 状态: $(sudo warp-cli --accept-tos status 2>/dev/null || true)"
          echo "[INFO] 当前出口 IP: $(curl -s --max-time 10 https://api.ipify.org | mask_ip || true)"
          echo "[INFO] WARP Trace:"
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace \
            | grep -E 'ip=|warp=|loc=' | mask_ip || true

      - name: 🚀 执行续订
        env:
          GODLIKE_ID: ${{ secrets.GODLIKE_ID }}
          GODLIKE_ID_INPUT: ${{ github.event.inputs.accounts }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u renew.py

      - name: 📤 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.REPO_TOKEN }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 4
