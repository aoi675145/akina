name: Icehost Auto Renew
on:
  workflow_dispatch:

jobs:
  run_renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write

    steps:
      - name: 📥 拉取当前仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: 📥 拉取私有脚本仓库
        uses: actions/checkout@v4
        with:
          repository: aoi675145/scripts
          ref: main
          path: private-scripts
          token: ${{ secrets.REPO_TOKEN }}

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装底层依赖与浏览器
        run: |
          sudo sed -i 's|URIs: mirror+file:/etc/apt/apt-mirrors.txt|URIs: https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources

          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
           
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyautogui python-xlib
          seleniumbase install chromedriver

      - name: 🛡️ 安装并启动代理
        env:
          NODE_LINK: ${{ secrets.Ice_PROXY_NODE }}
        run: |
          echo "::add-mask::$NODE_LINK"
          if [ -z "$NODE_LINK" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          # 调用私库共享代理脚本：解析节点 -> 生成 sing-box 配置 -> 启动并验证，
          # 成功后写入 IS_PROXY / PROXY_SERVER 到 GITHUB_ENV
          chmod +x private-scripts/scripts/setup_proxy.sh
          bash private-scripts/scripts/setup_proxy.sh

          source "$GITHUB_ENV"
          if [ "${IS_PROXY:-false}" != "true" ] || [ -z "${PROXY_SERVER:-}" ]; then
            echo "[ERROR] ❌ 代理脚本未返回有效的 PROXY_SERVER"
            exit 1
          fi

          PROXY_IP=$(curl -fsS --max-time 20 --proxy "$PROXY_SERVER" https://api.ipify.org) || {
            echo "[ERROR] 代理出口验证失败"
            exit 1
          }
          MASKED_IP=$(python3 -c 'import sys; p=sys.argv[1].strip().split("."); print(".".join(p[:2]+["***","***"]) if len(p)==4 else "***")' "$PROXY_IP")
          echo "✅ 代理出口 IP: $MASKED_IP"

      - name: 🚀 运行 Icehost Python 脚本
        env:
          Icehost: ${{ secrets.Icehost }}
          ICEHOST_COOKIE: ${{ secrets.ICEHOST_COOKIE }}
          Ice_PROXY_NODE: ${{ env.PROXY_SERVER }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "::add-mask::$ICEHOST_COOKIE"
          echo "::add-mask::$Ice_PROXY_NODE"
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$TG_CHAT_ID"
          # 使用 xvfb-run 分配虚拟屏幕，让 xdotool 能够正常点击
          xvfb-run -a -s "-screen 0 1920x1080x24" python private-scripts/scripts/icehost/main.py 2>&1 | tee renew.log

      # - name: 自动修改下一次运行时间
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
